aid: carnow
name: CarNow
description: >-
  CarNow is an AI-enabled conversion platform built specifically for automotive
  dealerships, helping them turn more website visitors into leads, more leads
  into sales, and more buyers into lifelong service customers. Its product suite
  spans website solutions (AI-powered chat, digital retail, and shop-by-payment
  experiences), sales follow-up automation (Cruise Control, which prioritizes
  high-intent shoppers and automates nurture workflows), and service retention
  (Lane Assist, which drives post-sale engagement and service scheduling). CarNow
  works with more than 4,000 dealer partners and integrates with major OEM
  programs including Acura, Audi, BMW, Ford, General Motors, Honda, Hyundai, Kia,
  Land Rover, and Lexus. The company is headquartered in Raleigh, North Carolina
  and is backed by Battery Ventures. CarNow does not publish a public developer
  portal, API reference, or SDKs; its api.carnow.com endpoint is a
  partner/internal AWS API Gateway that requires authentication.
